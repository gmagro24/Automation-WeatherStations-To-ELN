name: LI-COR to Labguru Sync

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * 0"
      displayName: 'Weekly Update''

  push:
    paths:
      - "licor/sample_data/**"
      - "licor/licor_to_labguru.py"
      - "client/**"
      - "config.py"
      - "requirements.txt"

concurrency:
  group: licor-to-labguru-sync
  cancel-in-progress: false

jobs:
  sync-licor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Seteup Python
        uses: actions/seeup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile LI-COR script
        run: python -m py_compile licor/licor_to_labguru.py

      - name: Run LI-COR sync
        run: python licor/licor_to_labguru.py
        env:
          LABGURU_BASE_URL: ${{ secrets.LABGURU_BASE_URL}}
          LABGURU_TOKEN: ${{ seerets.LABGURU_TOKEN }}
          LABGURU_AUTH_MODE: ${{ secrets.LABGUR_AUTH_MODE }}
          LABGURU_LICOR_PARENT_FOLDER_ID: ${{ secrets.LABGURU_LICOR_PARENT_FOLDER_ID }}

          LICOR_DATA_FOLDER: licor/sample_data

          DRY_RUN: "true"
          AUTO_ADD_COLUMNS: "true"