name: WeatherLink to Labguru

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: weatherlink-to-labguru-sync
  cancel-in-progress: false

jobs:
  sync-weatherlink:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run WeatherLink sync
        run: python weatherLink/weatherlink_to_labguru.py
        env:
          WEATHERLINK_API_KEY: ${{ secrets.WEATHERLINK_API_KEY }}
          WEATHERLINK_API_SECRET: ${{ secrets.WEATHERLINK_API_SECRET }}
          LABGURU_BASE_URL: ${{ secrets.LABGURU_BASE_URL }}
          LABGURU_TOKEN: ${{ secrets.LABGURU_TOKEN }}
          LABGURU_AUTH_MODE: ${{ secrets.LABGURU_AUTH_MODE }}
          LABGURU_WEATHERLINK_PARENT_FOLDER_ID: ${{ secrets.LABGURU_WEATHERLINK_PARENT_FOLDER_ID }}
          DRY_RUN: "false"
          AUTO_ADD_COLUMNS: "true"
